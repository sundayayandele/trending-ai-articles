<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Conceptual agent evaluation security architecture"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#35689a"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#c62828"/></marker></defs><rect width="1000" height="420" fill="#fff"/><text x="36" y="38" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#10233b">Bounded AI Agent Evaluation — Proposed Architecture</text><text x="36" y="61" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Conceptual design; not Anthropic infrastructure and not a validated deployment</text><g font-family="Arial,sans-serif"><rect x="36" y="88" width="170" height="66" rx="12" fill="#e8f2ff" stroke="#334155" stroke-width="1.5"/><text x="121" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#14213d">Human reviewer</text><text x="121" y="135" text-anchor="middle" font-size="12" fill="#334155">Scoped approvals</text><rect x="265" y="88" width="180" height="66" rx="12" fill="#e8f2ff" stroke="#334155" stroke-width="1.5"/><text x="355" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#14213d">Policy gateway</text><text x="355" y="135" text-anchor="middle" font-size="12" fill="#334155">AuthN / AuthZ</text><rect x="506" y="88" width="190" height="66" rx="12" fill="#fff2df" stroke="#334155" stroke-width="1.5"/><text x="601" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#14213d">Ephemeral runner</text><text x="601" y="135" text-anchor="middle" font-size="12" fill="#334155">No default egress</text><rect x="760" y="88" width="210" height="66" rx="12" fill="#e6f8ee" stroke="#334155" stroke-width="1.5"/><text x="865" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#14213d">Mock tools / fixtures</text><text x="865" y="135" text-anchor="middle" font-size="12" fill="#334155">Synthetic data only</text><rect x="266" y="255" width="180" height="66" rx="12" fill="#e8f2ff" stroke="#334155" stroke-width="1.5"/><text x="356" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#14213d">Short-lived identity</text><text x="356" y="302" text-anchor="middle" font-size="12" fill="#334155">Per-run scope</text><rect x="520" y="255" width="190" height="66" rx="12" fill="#e6f8ee" stroke="#334155" stroke-width="1.5"/><text x="615" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#14213d">Independent logs</text><text x="615" y="302" text-anchor="middle" font-size="12" fill="#334155">External collector</text><rect x="764" y="255" width="206" height="66" rx="12" fill="#ffe9e9" stroke="#334155" stroke-width="1.5"/><text x="867" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#14213d">Production / Internet</text><text x="867" y="302" text-anchor="middle" font-size="12" fill="#334155">DENIED by default</text><line x1="206" y1="121" x2="265" y2="121" stroke="#35689a" stroke-width="2.5"  marker-end="url(#blue)"/><line x1="445" y1="121" x2="506" y2="121" stroke="#35689a" stroke-width="2.5"  marker-end="url(#blue)"/><line x1="696" y1="121" x2="760" y2="121" stroke="#35689a" stroke-width="2.5"  marker-end="url(#blue)"/><line x1="356" y1="255" x2="356" y2="155" stroke="#35689a" stroke-width="2.5"  marker-end="url(#blue)"/><line x1="615" y1="155" x2="615" y2="255" stroke="#35689a" stroke-width="2.5"  marker-end="url(#blue)"/><line x1="696" y1="140" x2="764" y2="255" stroke="#c62828" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#red)"/></g><text x="37" y="375" font-family="Arial,sans-serif" font-size="13" fill="#475569">Enforcement: independent network deny + identity scopes + action gateway + external audit.</text></svg>