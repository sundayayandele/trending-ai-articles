<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="480" viewBox="0 0 1180 480" role="img" aria-label="Proposed GitHub Copilot automations workflow and public repository fallback"><title>Proposed Agentic DevOps Workflow</title><rect width="1180" height="480" fill="#f8fafc"/><text x="35" y="45" font-family="Arial" font-size="26" font-weight="bold" fill="#0f172a">GitHub agentic DevOps — proposed workflow</text><text x="35" y="72" font-family="Arial" font-size="15" fill="#475569">Conceptual; public repositories cannot use Copilot automations as documented on 29 Oct 2026</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><g font-family="Arial" font-size="16" text-anchor="middle"><rect x="25" y="136" width="185" height="82" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="117" y="167">Private/internal</text><text x="117" y="190">repo trigger</text><rect x="250" y="136" width="185" height="82" rx="10" fill="#e0e7ff" stroke="#4f46e5"/><text x="342" y="167">Scoped Copilot</text><text x="342" y="190">automation</text><rect x="475" y="136" width="185" height="82" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="567" y="167">Fusion router</text><text x="567" y="190">+ approved model</text><rect x="700" y="136" width="185" height="82" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="792" y="167">Draft PR and</text><text x="792" y="190">independent CI</text><rect x="925" y="136" width="225" height="82" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="1037" y="167">Human approval</text><text x="1037" y="190">protected branch</text><rect x="25" y="290" width="185" height="76" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="117" y="320">Public repo</text><text x="117" y="341">no Copilot automations</text><rect x="250" y="290" width="185" height="76" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="342" y="320">Alternative</text><text x="342" y="341">GitHub Actions</text></g><g stroke="#334155" stroke-width="2.5" marker-end="url(#a)"><line x1="210" y1="177" x2="247" y2="177"/><line x1="435" y1="177" x2="472" y2="177"/><line x1="660" y1="177" x2="697" y2="177"/><line x1="885" y1="177" x2="922" y2="177"/><line x1="210" y1="328" x2="247" y2="328"/><polyline points="435,328 792,328 792,222" fill="none"/></g><text x="500" y="433" font-family="Arial" font-size="16" fill="#334155">Security boundaries: minimal tools • budget caps • independent tests • human review</text></svg>