<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Proposed enterprise AI agent evaluation architecture</title><desc id="desc">Versioned task registry and policy gates feed an evaluation orchestrator, isolated sandbox and pinned model harness; scoring and evidence flow to human approval and shadow mode.</desc><rect width="1200" height="600" fill="#f7fafc"/><text x="600" y="50" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" font-weight="bold" fill="#123047">Enterprise AI Agent Evaluation — Proposed Reference Architecture</text><text x="600" y="79" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#516879">Conceptual design, not a deployed GDPx system</text><g font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#102b3a"><rect x="35" y="160" width="220" height="100" rx="12" fill="#dceeff" stroke="#417fa4" stroke-width="2"/><text x="145" y="199">Versioned tasks</text><text x="145" y="224">and policy gates</text><rect x="330" y="160" width="220" height="100" rx="12" fill="#dceeff" stroke="#417fa4" stroke-width="2"/><text x="440" y="199">Evaluation</text><text x="440" y="224">orchestrator</text><rect x="625" y="145" width="250" height="130" rx="12" fill="#fff1d9" stroke="#c57c24" stroke-width="2"/><text x="750" y="183">Ephemeral isolated</text><text x="750" y="210">sandbox + tools</text><text x="750" y="237">Pinned model/harness</text><rect x="940" y="160" width="225" height="100" rx="12" fill="#dcf6e7" stroke="#33835e" stroke-width="2"/><text x="1052" y="199">Scoring and</text><text x="1052" y="224">evidence store</text><rect x="390" y="395" width="260" height="100" rx="12" fill="#e9e4ff" stroke="#7566aa" stroke-width="2"/><text x="520" y="434">Human promotion gate</text><text x="520" y="459">approve / reject</text><rect x="790" y="395" width="260" height="100" rx="12" fill="#dcf6e7" stroke="#33835e" stroke-width="2"/><text x="920" y="434">Read-only shadow pilot</text><text x="920" y="459">no production writes</text></g><g stroke="#48677b" stroke-width="3" fill="none"><path d="M255 210H330"/><path d="M550 210H625"/><path d="M875 210H940"/><path d="M1052 260V330H520V395"/><path d="M650 445H790"/></g><g fill="#48677b"><path d="M330 210l-12 -7v14z"/><path d="M625 210l-12 -7v14z"/><path d="M940 210l-12 -7v14z"/><path d="M520 395l-7 -12h14z"/><path d="M790 445l-12 -7v14z"/></g><text x="600" y="554" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#516879">All external actions require explicit authorization; audit traces should be sanitized and access-controlled.</text></svg>