<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-label="Conceptual defensive SOC architecture for infostealer incidents">
<rect width="1180" height="650" fill="#f7fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#182c45} .h{font-size:28px;font-weight:700} .s{font-size:16px} .box{fill:#fff;stroke:#4b6584;stroke-width:2;rx:12} .label{font-size:18px;font-weight:700} .small{font-size:14px} .line{stroke:#346e95;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#346e95"/></marker></defs>
<text x="42" y="53" class="h">VOLTA-inspired defensive SOC reference architecture</text><text x="42" y="83" class="s">Conceptual / proposed — not a validated deployment; no malware execution required</text>
<rect x="40" y="132" width="300" height="152" class="box"/><text x="61" y="168" class="label">Managed endpoints</text><text x="61" y="198" class="s">EDR process / file / network</text><text x="61" y="225" class="s">Application control policies</text><text x="61" y="252" class="small">Untrusted device telemetry</text>
<rect x="40" y="344" width="300" height="196" class="box"/><text x="61" y="380" class="label">Identity + applications</text><text x="61" y="411" class="s">IdP sign-in and refresh tokens</text><text x="61" y="440" class="s">SaaS app-issued sessions</text><text x="61" y="469" class="s">Cloud keys and audit events</text><text x="61" y="504" class="small">Separate token issuers</text>
<rect x="428" y="236" width="270" height="186" class="box"/><text x="450" y="272" class="label">SIEM + case management</text><text x="450" y="304" class="s">Correlate endpoint + identity</text><text x="450" y="333" class="s">Preserve chain of custody</text><text x="450" y="362" class="s">Read-only detection first</text><text x="450" y="393" class="small">Sanitized analyst evidence</text>
<rect x="787" y="158" width="345" height="134" class="box"/><text x="809" y="194" class="label">Human incident approval</text><text x="809" y="226" class="s">RBAC • decision log • escalation</text><text x="809" y="256" class="small">No unreviewed LLM remediation</text>
<rect x="787" y="355" width="345" height="186" class="box"/><text x="809" y="391" class="label">Controlled response</text><text x="809" y="422" class="s">EDR device isolation</text><text x="809" y="451" class="s">App-specific session revocation</text><text x="809" y="480" class="s">Password / cloud-key rotation</text><text x="809" y="511" class="small">Verify containment independently</text>
<path class="line" d="M340 208 L428 284"/><path class="line" d="M340 442 L428 370"/><path class="line" d="M698 298 L787 225"/><path class="line" d="M960 292 L960 355"/><path class="line" d="M787 465 L705 465 L705 569 L185 569 L185 540"/>
<text x="43" y="620" class="small">Sources: Cisco Talos (2026-10-31), Microsoft Learn, MITRE ATT&amp;CK. Architecture is an editorial proposal.</text></svg>