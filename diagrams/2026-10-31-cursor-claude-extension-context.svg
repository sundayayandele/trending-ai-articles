<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Proposed secure developer workstation extension architecture</title><desc id="desc">Approved extension registry feeds managed developer endpoint, which connects via access broker to Git, CI and cloud with short-lived credentials. Telemetry goes to detection and response.</desc><rect width="1100" height="610" fill="#f8fafc"/><text x="50" y="54" font-size="29" font-family="Arial" font-weight="700" fill="#0f172a">Secure AI Developer Workstation — Proposed Architecture</text><text x="50" y="84" font-size="15" font-family="Arial" fill="#475569">Conceptual control design, not a deployed or vendor-verified system</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs><g font-family="Arial" font-size="17" text-anchor="middle"><rect x="45" y="145" width="255" height="110" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="172" y="184" fill="#1e3a8a">Approved extension</text><text x="172" y="210" fill="#1e3a8a">registry + provenance</text><rect x="410" y="145" width="275" height="110" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="548" y="184" fill="#075985">Managed developer endpoint</text><text x="548" y="210" fill="#075985">IDE + extension host</text><rect x="795" y="145" width="260" height="110" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="925" y="184" fill="#166534">Access broker</text><text x="925" y="210" fill="#166534">scoped short-lived tokens</text><rect x="795" y="335" width="260" height="110" rx="13" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="925" y="373" fill="#166534">Git / CI / cloud APIs</text><text x="925" y="400" fill="#166534">audited privileged actions</text><rect x="410" y="335" width="275" height="110" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="548" y="374" fill="#92400e">Endpoint telemetry</text><text x="548" y="401" fill="#92400e">EDR + extension inventory</text><rect x="45" y="335" width="255" height="110" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="172" y="374" fill="#991b1b">SOC / incident response</text><text x="172" y="401" fill="#991b1b">isolate, revoke, rebuild</text></g><g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arr)"><path d="M300 200 H410"/><path d="M685 200 H795"/><path d="M925 255 V335"/><path d="M548 255 V335"/><path d="M410 390 H300"/><path d="M795 390 H685"/></g><text x="50" y="518" font-family="Arial" font-size="15" fill="#475569">Trust boundaries: extension artifact → endpoint → credential broker → production APIs</text><text x="50" y="545" font-family="Arial" font-size="15" fill="#475569">Key design goal: no standing production secrets in the IDE process.</text></svg>