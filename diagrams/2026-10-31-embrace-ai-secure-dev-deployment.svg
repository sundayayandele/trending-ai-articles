<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Proposed isolated AI development deployment topology</title><desc id="desc">Developer accesses ephemeral sandbox, where agent and browser run with constrained filesystem, policy broker, short-lived credentials and external audit.</desc><rect width="1120" height="600" fill="#f8fafc"/><text x="40" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Secure AI Development — Proposed Deployment Topology</text><text x="40" y="85" font-family="Arial" font-size="15" fill="#475569">Disposable environment; no standing production credentials or privileged host mounts</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#64748b"/></marker></defs><g font-family="Arial" text-anchor="middle" font-size="17"><rect x="45" y="180" width="220" height="110" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="155" y="219" fill="#1e40af">Developer endpoint</text><text x="155" y="246" fill="#1e40af">no production secrets</text><rect x="345" y="140" width="430" height="310" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="560" y="178" fill="#155e75" font-weight="700">Ephemeral VM / constrained dev sandbox</text><rect x="380" y="212" width="170" height="100" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="465" y="249" fill="#92400e">Browser preview</text><text x="465" y="275" fill="#92400e">untrusted input</text><rect x="570" y="212" width="170" height="100" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="655" y="249" fill="#075985">Agent planner</text><text x="655" y="275" fill="#075985">limited context</text><rect x="450" y="335" width="225" height="82" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="562" y="368" fill="#166534">Independent broker</text><text x="562" y="393" fill="#166534">files / tools / egress</text><rect x="860" y="180" width="210" height="110" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="965" y="218" fill="#5b21b6">Scoped identity</text><text x="965" y="244" fill="#5b21b6">and audit services</text></g><g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M265 235 H345"/><path d="M550 260 H570"/><path d="M655 312 V335"/><path d="M675 376 H825 V290 H860"/></g><text x="42" y="510" font-family="Arial" font-size="16" fill="#334155">Validate: denied out-of-root file access, denied unauthorized commands, trusted origin and audit events.</text><text x="42" y="540" font-family="Arial" font-size="16" fill="#334155">Container isolation alone is insufficient when host sockets, home directories or secrets are mounted.</text></svg>