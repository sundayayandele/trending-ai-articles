<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Proposed defensive AI security evaluation architecture"><title>Proposed AI Security Evaluation Architecture</title><rect width="1200" height="410" fill="#f8fafc"/><text x="42" y="48" font-family="Arial" font-size="27" font-weight="bold" fill="#0f172a">AI-assisted security review — proposed architecture</text><text x="42" y="77" font-family="Arial" font-size="15" fill="#475569">Conceptual design; not Google's deployed system</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><g font-family="Arial" font-size="16" text-anchor="middle"><rect x="35" y="140" width="200" height="88" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="135" y="172">Approved immutable</text><text x="135" y="194">repository snapshot</text><rect x="278" y="140" width="195" height="88" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="375" y="172">Read-only model</text><text x="375" y="194">analysis adapter</text><rect x="515" y="140" width="195" height="88" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="612" y="172">Evidence and</text><text x="612" y="194">human triage</text><rect x="753" y="140" width="195" height="88" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="850" y="172">Isolated patch</text><text x="850" y="194">branch + CI</text><rect x="990" y="140" width="175" height="88" rx="12" fill="#d1fae5" stroke="#059669"/><text x="1077" y="172">Reviewed PR</text><text x="1077" y="194">approval gate</text></g><g stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"><line x1="235" y1="184" x2="275" y2="184"/><line x1="473" y1="184" x2="512" y2="184"/><line x1="710" y1="184" x2="750" y2="184"/><line x1="948" y1="184" x2="987" y2="184"/></g><rect x="280" y="285" width="680" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="7 4"/><text x="620" y="311" text-anchor="middle" font-family="Arial" font-size="17" fill="#991b1b">No direct model access to production credentials or deployment</text><text x="620" y="337" text-anchor="middle" font-family="Arial" font-size="14" fill="#991b1b">Independent policy, telemetry, audit, and reviewer controls</text></svg>