<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Proposed authorized AI security research architecture"><rect width="1280" height="420" fill="#0b1220"/><text x="45" y="48" fill="#f8fafc" font-size="27" font-family="Arial" font-weight="bold">Proposed defensive AI research architecture</text><text x="45" y="77" fill="#94a3b8" font-size="15" font-family="Arial">Conceptual design only — not a verified deployment</text><g font-family="Arial" font-size="17" text-anchor="middle"><rect x="35" y="135" width="200" height="95" rx="14" fill="#1d4ed8"/><text x="135" y="174" fill="white">Asset owner + analyst</text><text x="135" y="201" fill="white">Signed scope</text><rect x="285" y="135" width="210" height="95" rx="14" fill="#0f766e"/><text x="390" y="175" fill="white">Policy broker</text><text x="390" y="201" fill="white">Action enforcement</text><rect x="550" y="100" width="230" height="85" rx="14" fill="#4338ca"/><text x="665" y="136" fill="white">Approved AI model</text><text x="665" y="161" fill="white">Reasoning only</text><rect x="550" y="230" width="230" height="85" rx="14" fill="#92400e"/><text x="665" y="265" fill="white">Ephemeral sandbox</text><text x="665" y="290" fill="white">Restricted execution</text><rect x="840" y="135" width="180" height="95" rx="14" fill="#334155"/><text x="930" y="173" fill="white">Evidence vault</text><text x="930" y="201" fill="white">Human review</text><rect x="1060" y="135" width="185" height="95" rx="14" fill="#166534"/><text x="1152" y="174" fill="white">Draft patch PR</text><text x="1152" y="201" fill="white">Human release gate</text></g><g stroke="#94a3b8" stroke-width="3" fill="none"><path d="M235 182 H285"/><path d="M495 162 L550 142"/><path d="M495 205 L550 270"/><path d="M780 142 L840 162"/><path d="M780 270 L840 210"/><path d="M1020 182 H1060"/></g><text x="45" y="380" fill="#94a3b8" font-size="16" font-family="Arial">Every tool call must be authorized independently