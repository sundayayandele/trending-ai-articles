<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Proposed incident response workflow for tampered IDE extension</title><desc id="desc">Identify scoped endpoints, collect evidence, isolate affected hosts, revoke credentials, clean or rebuild and verify.</desc><rect width="1100" height="470" fill="#f8fafc"/><text x="45" y="52" font-size="28" font-family="Arial" font-weight="700" fill="#0f172a">Tampered Extension — Proposed Response Flow</text><text x="45" y="82" font-size="15" font-family="Arial" fill="#475569">Use vendor indicators; preserve evidence and follow organizational incident procedures.</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker></defs><g font-family="Arial" font-size="17" text-anchor="middle"><rect x="42" y="175" width="165" height="94" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="124" y="212" fill="#1e40af">Scope hosts</text><text x="124" y="238" fill="#1e40af">and versions</text><rect x="250" y="175" width="165" height="94" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="332" y="212" fill="#075985">Collect logs</text><text x="332" y="238" fill="#075985">and indicators</text><rect x="458" y="175" width="165" height="94" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="540" y="212" fill="#991b1b">Isolate</text><text x="540" y="238" fill="#991b1b">confirmed hosts</text><rect x="666" y="175" width="165" height="94" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="748" y="212" fill="#92400e">Revoke and</text><text x="748" y="238" fill="#92400e">rotate access</text><rect x="874" y="175" width="182" height="94" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="965" y="212" fill="#166534">Rebuild / verify</text><text x="965" y="238" fill="#166534">and monitor</text></g><g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M207 222 H250"/><path d="M415 222 H458"/><path d="M623 222 H666"/><path d="M831 222 H874"/></g><text x="45" y="340" font-family="Arial" font-size="16" fill="#334155">A negative single-file check is not proof of safety. Update/uninstall alone may leave persistence.</text><text x="45" y="372" font-family="Arial" font-size="16" fill="#334155">No live malware or malicious SSH infrastructure is needed for training demonstrations.</text></svg>