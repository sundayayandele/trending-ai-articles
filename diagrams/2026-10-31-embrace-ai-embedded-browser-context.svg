<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="630" viewBox="0 0 1180 630" role="img" aria-labelledby="title desc"><title id="title">Proposed EMBRACE-resilient embedded browser architecture</title><desc id="desc">Untrusted web content passes through constrained preview and verified origin to data-only adapter, agent planner, independent policy broker, scoped file tools, network and audit.</desc><rect width="1180" height="630" fill="#f8fafc"/><text x="45" y="51" font-family="Arial" font-size="29" font-weight="700" fill="#0f172a">AI Embedded Browser — Proposed Trust-Boundary Architecture</text><text x="45" y="80" font-family="Arial" font-size="15" fill="#475569">Conceptual design, not a tested fix or a representation of any vendor product</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#64748b"/></marker></defs><g font-family="Arial" font-size="16" text-anchor="middle"><rect x="40" y="145" width="180" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="130" y="187" fill="#991b1b">Untrusted web</text><text x="130" y="213" fill="#991b1b">or local HTML</text><rect x="285" y="145" width="200" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="385" y="184" fill="#92400e">Sandboxed preview</text><text x="385" y="210" fill="#92400e">verified origin</text><rect x="550" y="145" width="200" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="650" y="184" fill="#1e40af">Data-only adapter</text><text x="650" y="210" fill="#1e40af">untrusted context</text><rect x="815" y="145" width="220" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="925" y="184" fill="#075985">AI agent planner</text><text x="925" y="210" fill="#075985">proposes, not grants</text><rect x="815" y="345" width="220" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="925" y="382" fill="#166534">Independent policy</text><text x="925" y="407" fill="#166534">and approval broker</text><rect x="550" y="345" width="200" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="650" y="382" fill="#166534">Scoped file access</text><text x="650" y="407" fill="#166534">all workers / frames</text><rect x="285" y="345" width="200" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="385" y="382" fill="#166534">Tools / MCP / egress</text><text x="385" y="407" fill="#166534">allowlisted actions</text><rect x="40" y="345" width="180" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="130" y="382" fill="#5b21b6">Independent audit</text><text x="130" y="407" fill="#5b21b6">SOC telemetry</text></g><g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M220 200 H285"/><path d="M485 200 H550"/><path d="M750 200 H815"/><path d="M925 255 V345"/><path d="M815 395 H750"/><path d="M550 395 H485"/><path d="M285 395 H220"/></g><text x="45" y="520" font-family="Arial" font-size="16" fill="#334155">Rule: preview data cannot directly invoke privileged tools or change the trusted URL.</text><text x="45" y="550" font-family="Arial" font-size="16" fill="#334155">File and network access is enforced outside the model and outside the page.</text></svg>