</g>
<g fill="none" stroke="#c36a70" stroke-width="2.5" stroke-dasharray="8 7"><path d="M585 570 V510 H725 V444"/><path d="M585 570 V495 H725 V244"/></g>
<text x="60" y="691" font-family="Arial,sans-serif" font-size="14" fill="#506879">Security decisions and product integration details require customer-specific validation.</text>
</svg>