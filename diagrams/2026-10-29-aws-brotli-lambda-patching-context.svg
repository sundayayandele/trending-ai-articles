<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Proposed cross-runtime AWS Brotli patch workflow"><title>AWS Brotli CVE Patch Workflow</title><rect width="1200" height="470" fill="#f8fafc"/><text x="36" y="45" font-family="Arial" font-size="26" font-weight="bold" fill="#0f172a">CVE-2026-111497 — proposed AWS remediation workflow</text><text x="36" y="72" font-family="Arial" font-size="15" fill="#475569">Customer-run patch process, not AWS service internals</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><g font-family="Arial" font-size="16" text-anchor="middle"><rect x="30" y="143" width="198" height="90" rx="11" fill="#dbeafe" stroke="#2563eb"/><text x="129" y="176">Inventory Lambda,</text><text x="129" y="198">containers, CI</text><rect x="265" y="143" width="198" height="90" rx="11" fill="#e0e7ff" stroke="#4f46e5"/><text x="364" y="176">Check vendor and</text><text x="364" y="198">regional patch state</text><rect x="500" y="143" width="198" height="90" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="599" y="176">Patch, rebuild,</text><text x="599" y="198">test in staging</text><rect x="735" y="143" width="198" height="90" rx="11" fill="#dcfce7" stroke="#16a34a"/><text x="834" y="176">Canary deploy</text><text x="834" y="198">with rollback gate</text><rect x="970" y="143" width="198" height="90" rx="11" fill="#d1fae5" stroke="#059669"/><text x="1069" y="176">Verify patch ID,</text><text x="1069" y="198">logs and digest</text></g><g stroke="#334155" stroke-width="2.5" marker-end="url(#a)"><line x1="228" y1="188" x2="262" y2="188"/><line x1="463" y1="188" x2="497" y2="188"/><line x1="698" y1="188" x2="732" y2="188"/><line x1="933" y1="188" x2="967" y2="188"/></g><rect x="230" y="299" width="750" height="90" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="7 4"/><text x="605" y="329" text-anchor="middle" font-family="Arial" font-size="17" fill="#991b1b">Temporary mitigation: AWS WAF Count → impact review → Block</text><text x="605" y="357" text-anchor="middle" font-family="Arial" font-size="15" fill="#991b1b">Inbound Brotli only; not a substitute for runtime and library patches</text></svg>